name: iOS TestFlight

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-testflight-main
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 40
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require ios-testflight secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          for secret_name in APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY_P8; do
            if [[ -z "${!secret_name}" ]]; then
              echo "missing required ios-testflight secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          auth_key="$RUNNER_TEMP/AuthKey.p8"
          key="${APP_STORE_CONNECT_API_KEY_P8//$'\r'/}"
          if [[ "$key" != *$'\n'* ]]; then
            key="${key//\\n/$'\n'}"
          fi
          printf '%s\n' "$key" > "$auth_key"
          chmod 600 "$auth_key"
          if ! grep -q "BEGIN PRIVATE KEY" "$auth_key"; then
            echo "APP_STORE_CONNECT_API_KEY_P8 is not a PEM private key" >&2
            exit 1
          fi
          echo "ASC_AUTH_KEY_PATH=$auth_key" >> "$GITHUB_ENV"

      - name: Archive Money Snap for iOS
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/MoneySnap.xcodeproj \
            -scheme MoneySnap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MoneySnap.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION=0.1.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Test signing validation
        run: python3 -m unittest discover -s ios/scripts -p 'test_verify_testflight_signing.py'

      - name: Export signed IPA without uploading
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          bash ios/scripts/write-testflight-export-options.sh "$APPLE_TEAM_ID" "$export_plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MoneySnap.xcarchive" \
            -exportPath "$RUNNER_TEMP/MoneySnapExport" \
            -exportOptionsPlist "$export_plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify signed IPA and upload exact verified file
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/MoneySnapExport/"*.ipa)
          [[ ${#ipas[@]} -eq 1 ]] || { echo "Expected exactly one exported IPA" >&2; exit 1; }
          python3 ios/scripts/verify_testflight_signing.py "${ipas[0]}" \
            --team "$APPLE_TEAM_ID" --build "${{ github.run_number }}" \
            --report "$RUNNER_TEMP/signing-verification.json"
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || exit 1
          upload_dir=$(mktemp -d "$RUNNER_TEMP/moneysnap-upload.XXXXXX")
          key_path="$upload_dir/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -m 700 "$upload_dir/private_keys"
          trap 'rm -f "$key_path"' EXIT
          install -m 600 "$ASC_AUTH_KEY_PATH" "$key_path"
          cd "$upload_dir"
          xcrun altool --upload-app --type ios --file "${ipas[0]}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Retain sanitized signing verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testflight-signing-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/signing-verification.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$ASC_AUTH_KEY_PATH" "$RUNNER_TEMP/ExportOptions.plist"
